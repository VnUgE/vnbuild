
version: '3'

includes:
  module:
    dir: ..
    taskfile: '../Module.Taskfile.yaml'
    internal: true

vars:
  BINARY_DIR: '{{ .BINARY_DIR | default "bin" }}'
  BUILD_DIR: build
  VNBUILD_DIR: '{{ .USER_WORKING_DIR }}/vnbuild'

  BASE_IMAGES: ["ubuntu-amd64", "fedora-amd64"]

tasks:

  build:
    deps:
     - build-vnbuild
    cmds:
     - for: { var: BASE_IMAGES }
       task: build-image
       vars: { BASE_IMAGE_NAME: '{{ .ITEM }}' }

  build-image:
    internal: true
    vars:
      BUILD_DIR: '{{ .BUILD_DIR }}/{{ .BASE_IMAGE_NAME }}'
    cmds:
     - cmd: powershell mkdir -f "{{ .BUILD_DIR }}"
     - cmd: powershell mkdir -f "{{ .BUILD_DIR }}/app"
     - cmd: powershell cp "{{ .VNBUILD_DIR }}/*" "{{ .BUILD_DIR }}/app"
     - cmd: powershell cp "{{ .BASE_IMAGE_NAME }}.Dockerfile" "{{ .BUILD_DIR }}/Dockerfile"

  postbuild_success:
    vars:
      BINARY_DIR: '{{ .USER_WORKING_DIR }}/{{ .BINARY_DIR }}'
    cmds:
     - cmd: powershell mkdir -f "{{ .BINARY_DIR }}"
     - for: { var: BASE_IMAGES }
       cmd: cd "{{ .BUILD_DIR }}/{{ .ITEM }}" &&
         tar -czf "{{ .BINARY_DIR }}/{{ .ITEM }}.tgz" .
     
     - cmd: powershell rm -Recurse -Force "{{ .BUILD_DIR }}"
       ignore_error: true
     - cmd: powershell rm -Recurse -Force "{{ .VNBUILD_DIR }}"
       ignore_error: true


  build-vnbuild:
    cmds:
     - task: module:default
       vars:
         CONFIGURATION: 'release'
         CLI_ARGS: '
           -r linux-x64
           --output "{{ .VNBUILD_DIR }}"'

  clean:
    cmds:
     - for: [ vnbuild/, build/, bin/ ]
       cmd: powershell rm -Recurse -Force "{{ .ITEM }}"
       ignore_error: true