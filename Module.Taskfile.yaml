# https://taskfile.dev

version: '3'

vars:
  MODULE_NAME: '{{ .MODULE_NAME | default "vnbuild" }}'

  TARGET_ARCHES: [ "linux-x64", "win-x64", "osx-x64", "win-arm64", "linux-arm", "linux-arm64", "osx-arm64" ]

tasks:

  default:
    desc: 'Builds the VNLib.WebServer project with defaults'
    vars:
      CONFIGURATION: '{{ .CONFIGURATION | default "release" }}'
    cmds:
     - cmd: cd src/ && dotnet build -c {{ .CONFIGURATION }} {{ .CLI_ARGS }}

  #called by build pipeline to sync repo
  update:
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
     - cmd: git reset --hard  #clean up any local changes
     - cmd: git remote update
     - cmd: git pull origin {{ .BRANCH_NAME }} --verify-signatures

  build:
    desc: "DO NOT USE! Used by vnbuild CI to build the module."
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
    - cmd: dotnet gitversion /updateprojectfiles
    
    - cmd: dotnet restore --nologo --verbosity minimal

    - for: { var: TARGET_ARCHES }
      task: build-config
      vars: 
        RUNTIME_ID: '{{ .ITEM }}'
        BUILD_FLAGS: '{{ .BUILD_FLAGS }}'
        OUT_DIR: '{{ .SCRATCH_DIR }}/build/{{ .ITEM }}'

  build-config:
    internal: true
    dir: 'src'
    requires:
      vars: [RUNTIME_ID, BUILD_FLAGS, OUT_DIR]
    vars:
      INT_DIR: '{{ .SCRATCH_DIR | default "." }}/obj/'
    cmds:
     - cmd: dotnet publish 
        --sc false
        --nologo
        --no-restore
        --configuration release
        --runtime {{ .RUNTIME_ID }} 
        --output "{{ .OUT_DIR }}"
        /p:UseCommonOutputDirectory=true 
        /p:IntermediateOutputPath="{{ .INT_DIR }}"
        {{ .BUILD_FLAGS }}
  
  postbuild_success:
    desc: 'DO NOT USE! Used by vnbuild CI to run post build tasks.'
    deps:
      - for: { var: TARGET_ARCHES }
        task: postbuild-pack-config
        vars: { RUNTIME_ID: '{{ .ITEM }}' }
    cmds: 
    #git archive in the module directory
     - cmd: git archive --format {{ .ARCHIVE_FILE_FORMAT }} --output {{ .ARCHIVE_FILE_NAME }} HEAD

  postbuild-pack-config:
    internal: true
    requires:
      vars: [RUNTIME_ID]
    cmds:
     - cmd: cd "{{ .SCRATCH_DIR }}/build/{{ .RUNTIME_ID }}" 
        && tar{{ if eq OS "windows" }}.exe{{ end}} -czf "{{ .TASKFILE_DIR }}/src/bin/{{ .RUNTIME_ID }}.tgz" .

#called by build pipeline to clean module
  clean:
    dir: '{{ .USER_WORKING_DIR }}'
    cmds:
    #clean solution
    - cmd: dotnet clean /p:BuildInParallel=true /p:MultiProcessorCompilation=true
    - cmd: powershell rm -Force {{ .ARCHIVE_FILE_NAME }}
      ignore_error: true

  write-changelog:
    cmds:
     - cmd: git-cliff
         --verbose
         --config ci/cliff.toml
         --output 'CHANGELOG.md'
         --tag v{{ .VERSION }}
         {{ .CLI_ARGS }}