version: 56
jobs:
- name: Push to GitHub
  steps:
  - type: PushRepository
    name: GitHub Sync
    remoteUrl: https://github.com/VnUgE/vnbuild.git
    userName: VnUgE
    passwordSecret: git-access-token
    force: true
    condition: SUCCESSFUL
    optional: false
  - type: PushRepository
    name: Codeberg push sync
    remoteUrl: https://codeberg.org/VnUgE/vnbuild.git
    userName: VnUgE
    passwordSecret: codeberg-access-token
    force: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: TagCreateTrigger
  - type: BranchUpdateTrigger
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600

- name: Mock Build
  jobExecutor: windows
  steps:
  - type: CommandStep
    name: Checkout Code
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@

        cd @project_name@
        mise trust mise.toml
        mise install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@
        mise ci-vnbuild build --verbose --no-delay
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild publish
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@
        mise ci-vnbuild publish --verbose
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: PublishArtifactStep
    name: publish bins
    sourcePath: '@project_name@/src/bin'
    artifacts: '*'
    condition: SUCCESSFUL
    optional: true
  triggers:
  - type: BranchUpdateTrigger
    branches: -master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600

- name: Build and publish
  jobExecutor: publish-agents
  steps:
  - type: CommandStep
    name: Checkout Code
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        git clone @server_url@/@project_path@ --branch @branch@ @project_name@

        cd @project_name@
        mise trust mise.toml
        mise install
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@
        mise ci-vnbuild build --no-delay
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: VNBuild publish
    runInContainer: false
    interpreter:
      type: PowerShellInterpreter
      powershell: powershell.exe
      commands: |
        cd @project_name@
        mise ci-vnbuild publish --ftp "@secret:ftp_server_address@" --sign
    runAs: 0:0
    envVars:
    - name: FTP_USERNAME
      value: '@secret:ftp_username@'
    - name: FTP_PASSWORD
      value: '@secret:ftp_password@'
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  triggers:
  - type: BranchUpdateTrigger
    branches: master
    userMatch: anyone
  retryCondition: never
  maxAttempts: 4
  retryDelay: 30
  includeUpstreamWhenRebuild: false
  includeDownstreamWhenRebuild: false
  timeout: 3600
