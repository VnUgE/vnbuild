version: 37
jobs:
- name: Push to GitHub
  steps:
  - !PushRepository
    name: GitHub Sync
    remoteUrl: https://github.com/VnUgE/vnbuild.git
    userName: VnUgE
    passwordSecret: git-access-token
    force: false
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !TagCreateTrigger
    projects: vnbuild
  - !BranchUpdateTrigger
    projects: vnbuild
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Mock Build
  jobExecutor: windows
  steps:
  - !CommandStep
    name: Checkout Code
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        git clone @server_url@/@project_name@ --branch @branch@
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        vnbuild build --verbose --no-delay
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: VNBuild publish
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        vnbuild publish --verbose
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: -master
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Build and publish
  jobExecutor: publish-agents
  steps:
  - !CommandStep
    name: Checkout Code
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        git clone @server_url@/@project_name@ --branch @branch@
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: VNBuild build
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        vnbuild build --no-delay
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: VNBuild publish
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        vnbuild publish --ftp "@secret:ftp_server_address@" --sign
    envVars:
    - name: FTP_USERNAME
      value: '@secret:ftp_username@'
    - name: FTP_PASSWORD
      value: '@secret:ftp_password@'
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: master
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600
- name: Publish Images
  jobExecutor: docker
  steps:
  - !CheckoutStep
    name: code checkout
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    checkoutPath: '@project_name@'
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !CommandStep
    name: build step
    runInContainer: true
    image: www.vaughnnugent.com/vnbuild/vnbuild:latest-ubuntu
    interpreter: !DefaultInterpreter
      commands: |
        vnbuild build --no-delay
    useTTY: true
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageStep
    name: build fedora image
    buildPath: '@project_name@/contianers/images/fedora-amd64'
    output: !RegistryOutput
      tags: www.vaughnnugent.com/vnbuild/vnbuild:latest-fedora www.vaughnnugent.com/vnbuild/vnbuild:@commit_hash@-fedora docker.io/vnuge/vnbuild:latest-fedora docker.io/vnuge/vnbuild:@commit_hash@-fedora
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  - !BuildImageStep
    name: build ubuntu image
    buildPath: '@project_name@/contianers/images/ubuntu-amd64'
    output: !RegistryOutput
      tags: www.vaughnnugent.com/vnbuild/vnbuild:latest-ubuntu www.vaughnnugent.com/vnbuild/vnbuild:@commit_hash@-ubuntu docker.io/vnuge/vnbuild:latest-ubuntu docker.io/vnuge/vnbuild:@commit_hash@-ubuntu
    condition: ALL_PREVIOUS_STEPS_WERE_SUCCESSFUL
  triggers:
  - !BranchUpdateTrigger
    branches: master
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
